[package]
name = "flux"
version = "0.1.0"
edition = "2024"
description = "A compact and easy-to-use Rust autoclicker"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
enigo = "0.6.1"
global-hotkey = "0.8.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
